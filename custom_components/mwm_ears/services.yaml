select_color:
  name: Select exact color
  description: >-
    Sends one exact catalog color to the ears, bypassing color-wheel
    snapping so near-identical shades (simple blue vs palette pure blue)
    arrive as distinct commands.
  target:
    entity:
      domain: light
  fields:
    color:
      required: true
      name: Color
      description: >-
        The exact color to send: a catalog name ("lime green", "pure blue")
        or a "kind:value" selector ("simple:0x61", "palette:4").
      example: "simple:0x61"
      selector:
        text:

set_state:
  name: Set ears state
  description: >-
    Native pair-level control for automations, richer than light.turn_on:
    sets both ears' exact colors -- each ear independently or as a single
    native both shimmer -- plus a room-wide effect, in one call. Target any
    of the pair's lights or the mwm_ears device; a per-ear light entity
    cannot express e.g. "left green, right red" in one action.
  target:
    entity:
      domain: light
  fields:
    color:
      name: Both ears color
      description: >-
        Applies to both ears at once (the protocol's native both form, a
        single transmission) when left_color/right_color are unset: "off", a
        catalog color name, or a "kind:value" selector ("simple:0x61",
        "palette:4").
      example: "simple:0x61"
      selector:
        text: null
    left_color:
      name: Left ear color
      description: >-
        Exact color for the left ear only, keeping the right ear exactly as
        it is (composed fused both+restore frame): "off", a catalog color
        name, or a "kind:value" selector. Overrides `color` for this ear.
      example: "off"
      selector:
        text: null
    right_color:
      name: Right ear color
      description: >-
        Exact color for the right ear only, using the verified right-only
        forms: "off", a catalog color name, or a "kind:value" selector.
        Overrides `color` for this ear.
      example: "palette:4"
      selector:
        text: null
    effect:
      name: Effect
      description: >-
        Room-wide effect program run after any color changes. Effects are
        not per-ear: a wand/program command re-programs every ear in range.
      example: Color rotation
      selector:
        select:
          options:
# MWM-EFFECT-OPTIONS
            - Fade out
            - Fade up
            - Single flash
            - Pulse
            - Strobe flash
            - Hard transitions
            - Crossfade transitions
            - Color rotation
            - Flashing sequence
            - Quick four-color rotation
            - Random effect
            - Blackout
# MWM-EFFECT-OPTIONS