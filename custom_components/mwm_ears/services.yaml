select_color:
  name: Select exact color
  description: >-
    Sends one exact catalog color to the ears, bypassing color-wheel
    snapping so near-identical shades (simple blue vs palette pure blue)
    arrive as distinct commands.
  target:
    entity:
      domain: light
  fields:
    color:
      required: true
      name: Color
      description: >-
        The exact color to send: a catalog name ("lime green", "pure blue")
        or a "kind:value" selector ("simple:0x61", "palette:4").
      example: "simple:0x61"
      selector:
        text:

set_state:
  name: Set ears state
  description: >-
    Native pair-level control for automations, richer than light.turn_on:
    sets both ears' exact colors -- each ear independently or as a single
    native both shimmer -- plus a room-wide effect, in one call. Target any
    of the pair's lights or the mwm_ears device; a per-ear light entity
    cannot express e.g. "left green, right red" in one action.
  target:
    entity:
      domain: light
  fields:
    color:
      name: Both ears color
      description: >-
        Applies to both ears at once (the protocol's native both form, a
        single transmission) when left_color/right_color are unset: "off", a
        catalog color name, or a "kind:value" selector ("simple:0x61",
        "palette:4").
      example: "simple:0x61"
      selector:
        text: null
    left_color:
      name: Left ear color
      description: >-
        Exact color for the left ear only, using the verified left-only
        forms: "off", a catalog color name, or a "kind:value" selector.
        Overrides `color` for this ear.
      example: "off"
      selector:
        text: null
    right_color:
      name: Right ear color
      description: >-
        Exact color for the right ear only, keeping the left ear exactly as
        it is (composed fused both+restore frame): "off", a catalog color
        name, or a "kind:value" selector. Overrides `color` for this ear.
      example: "palette:4"
      selector:
        text: null
    effect:
      name: Effect
      description: >-
        Room-wide effect program run after any color changes. Effects are
        not per-ear: a wand/program command re-programs every ear in range.
      example: Color rotation
      selector:
        select:
          options:
# MWM-EFFECT-OPTIONS
            - Fade out
            - Fade up
            - Single flash
            - Pulse
            - Strobe flash
            - Hard transitions
            - Crossfade transitions
            - Color rotation
            - Flashing sequence
            - Quick four-color rotation
            - Random effect
            - Blackout
# MWM-EFFECT-OPTIONS
    incantation:
      name: Incantation
      description: >-
        Optional: instead of a bare effect, run a verified "show incantation"
        -- a single fused phrase in the exact shape mine park/wand/hat
        captures use (per-ear palette + simple other ear + cycle timer +
        effect invoke + closing D0 clause). One of pulse, strobe, fade,
        rotation, or off (stop the program); uses the color fields for the
        palette/simple slots. See docs/mwm-show-protocol.md for the source
        frames each is derived from.
      example: pulse
      selector:
        text: null

play_show:
  name: Play show file
  description: >-
    Replays a .msh show script through this room's infrared emitter,
    frame-by-frame on the show's own timeline. Unlike the MQTT capture-rig
    sender, this goes through the Home Assistant infrared entity platform,
    so it works on any transmitter (ESPHome or MQTT). Playback starts
    immediately and runs in the background; call stop_show to cancel.
  target:
    entity:
      domain: light
  fields:
    file:
      name: Show file
      description: >-
        Path to the .msh file. Relative paths resolve under the Home
        Assistant config directory.
      example: mwm_shows/park-cascade-demo.msh
      selector:
        text:
    script:
      name: Inline script
      description: >-
        Inline .msh script text, used instead of `file` for short shows.
      selector:
        text:
          multiline: true
    repeat:
      name: Repeat
      description: How many times to play the show.
      default: 1
      selector:
        number:
          min: 1
          max: 100
          mode: box
    reset:
      name: End-of-show reset
      description: Send an all-off frame when the show finishes.
      default: true
      selector:
        boolean:

stop_show:
  name: Stop show
  description: Stop the show currently playing in this room.
  target:
    entity:
      domain: light