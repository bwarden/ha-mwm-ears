name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Verify version sync (tag, manifest, const)"
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(python3 -c 'import json;print(json.load(open("custom_components/mwm_ears/manifest.json"))["version"])')"
          CONST="$(python3 -c 'import re;print(re.search(r"INTEGRATION_VERSION = \"([^\"]+)\"",open("custom_components/mwm_ears/const.py").read()).group(1))')"
          echo "tag=$TAG manifest=$MANIFEST const=$CONST"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::release tag '$TAG' does not match manifest '$MANIFEST' / const '$CONST'"
            exit 1
          fi

      - name: "Run unit tests"
        run: make test

      - name: "Build distribution zip"
        run: make dist

      - name: "Extract CHANGELOG entry for the release body"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY' > release-notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          m = re.search(
              r"^## \[" + re.escape(version) + r"\].*?(?=^## \[|\Z)",
              text, re.M | re.S,
          )
          if not m:
              sys.exit(f"no CHANGELOG entry for {version}")
          print(m.group(0).strip())
          PY
          cat release-notes.md

      - name: "Upload release"
        uses: "softprops/action-gh-release@v3"
        with:
          tag_name: "${{ github.ref_name }}"
          body_path: release-notes.md
          files: |
            dist/mwm_ears.zip
