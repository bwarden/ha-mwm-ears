name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Verify version sync (tag, manifest, const)"
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(python3 -c 'import json;print(json.load(open("custom_components/mwm_ears/manifest.json"))["version"])')"
          CONST="$(python3 -c 'import re;print(re.search(r"INTEGRATION_VERSION = \"([^\"]+)\"",open("custom_components/mwm_ears/const.py").read()).group(1))')"
          echo "tag=$TAG manifest=$MANIFEST const=$CONST"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::release tag '$TAG' does not match manifest '$MANIFEST' / const '$CONST'"
            exit 1
          fi

      - name: "Run unit tests"
        run: make test

      - name: "Build distribution zip"
        run: make dist

      - name: "Upload release"
        uses: "softprops/action-gh-release@v2"
        with:
          tag_name: "${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/mwm_ears.zip